<rect x="0.0" y="0.0" width="76.0" height="306" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="38.0" y="141.5" text-anchor="middle" fill="#212121">最小可用边界</text>
<text class="nl" x="38.0" y="164.5" text-anchor="middle" fill="#212121">目标是『现场双击即用、断网能查』</text>
<rect x="0.0" y="384.0" width="76.0" height="330.80000000000007" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="38.0" y="537.9" text-anchor="middle" fill="#212121">部署形态：单进程</text>
<text class="nl" x="38.0" y="560.9" text-anchor="middle" fill="#212121">界面 + 服务 + 设备通信同一个 exe</text>
<rect x="138.0" y="384.0" width="76.0" height="330.80000000000007" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="176.0" y="537.9" text-anchor="middle" fill="#212121">对外接口：单端口 8191</text>
<text class="nl" x="176.0" y="560.9" text-anchor="middle" fill="#212121">仅 3 条 WMS 路由 H4 / H5 / H6</text>
<rect x="138.0" y="384.0" width="76.0" height="330.80000000000007" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="176.0" y="537.9" text-anchor="middle" fill="#212121">存储：本地 SQLite</text>
<text class="nl" x="176.0" y="560.9" text-anchor="middle" fill="#212121">单文件、可整库拷走排查</text>
<rect x="138.0" y="384.0" width="76.0" height="330.80000000000007" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="176.0" y="537.9" text-anchor="middle" fill="#212121">协议：贴设备</text>
<text class="nl" x="176.0" y="560.9" text-anchor="middle" fill="#212121">HP-Socket TCP + Snap7，不加中间件</text>
<rect x="11.5" y="792.8" width="53.0" height="290" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="38.0" y="937.8" text-anchor="middle" fill="#212121">代价：共享故障域、状态集中</text>
<rect x="138.0" y="792.8" width="76.0" height="290" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="176.0" y="926.3" text-anchor="middle" fill="#212121">代价：无查询 API、未知路径返</text>
<text class="nl" x="176.0" y="949.3" text-anchor="middle" fill="#212121">回 500</text>
<rect x="276.0" y="792.8" width="76.0" height="290" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="314.0" y="926.3" text-anchor="middle" fill="#212121">代价：单写者模型不严格、无跨表</text>
<text class="nl" x="314.0" y="949.3" text-anchor="middle" fill="#212121">事务</text>
<rect x="287.5" y="792.8" width="53.0" height="290" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="314.0" y="937.8" text-anchor="middle" fill="#212121">代价：无背压、无入站鉴权</text>
<rect x="276.0" y="1160.8" width="76.0" height="274" rx="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.6"/>
<text class="nl" x="314.0" y="1286.3" text-anchor="middle" fill="#212121">结论：代价可接受，边界应保留</text>
<text class="nl" x="314.0" y="1309.3" text-anchor="middle" fill="#212121">先进程内分清职责，再谈拆进程</text>
