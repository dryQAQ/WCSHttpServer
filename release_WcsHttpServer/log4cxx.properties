﻿﻿﻿# 默认日志输出到控制台
log4j.rootLogger=DEBUG,  default
#log4j.rootLogger=TRACE, default

#log4j.logger用于控制日志采集级别及采集内容，Threshold用于控制日志输出级别

#输出到控制台
log4j.appender.stdout=org.apache.log4j.ConsoleAppender 
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout 
log4j.appender.stdout.layout.ConversionPattern=%d{HH:mm:ss,SSS} [%t] %-5p - %m%n

#输出到文件滚动（默认/Run模块）
log4j.appender.default=org.apache.log4j.RollingFileAppender
log4j.appender.default.File=./log/Run/run.log
log4j.appender.default.MaxFileSize=100MB
log4j.appender.default.MaxBackupIndex=80
log4j.appender.default.Append=true
log4j.appender.default.Threshol= TRACE
log4j.appender.default.layout=org.apache.log4j.PatternLayout
log4j.appender.default.layout.ConversionPattern=%d [%t] %-5p %.16c - %m%n

##hlog.async=false
##hlog.secret.show=true
##hlog.secret.encrypt=true


#WCS (波次管理、分拣状态)
log4j.logger.WCS=DEBUG,WCS
log4j.appender.WCS=org.apache.log4j.RollingFileAppender
log4j.appender.WCS.File=./log/WCS/WCS.log
log4j.appender.WCS.MaxFileSize=100MB
log4j.appender.WCS.MaxBackupIndex=80
log4j.appender.WCS.Append=true
log4j.appender.WCS.Threshold= DEBUG
log4j.appender.WCS.layout=org.apache.log4j.PatternLayout
log4j.appender.WCS.layout.ConversionPattern=%d [%t] %-5p %.16c - %m%n
log4j.additivity.WCS = false

